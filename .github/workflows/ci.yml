name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # better-sqlite3 requires Node >=22; 20 fails at install.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Upload the lockfile this runner resolved
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-linux
          path: package-lock.json
      - run: npm run lint
      - run: npm test
      # No AI CLI and no data/ on the runner — the build must not need either.
      - run: npm run build
