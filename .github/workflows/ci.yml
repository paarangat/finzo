name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork PRs run this workflow. Give the token nothing to do but read the code —
# it never needs to write, and this is the whole blast radius of a malicious PR.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # better-sqlite3 requires Node >=22; 20 fails at install.
        node: [22, 24]
    steps:
      # Pinned to commit SHAs, not tags: a tag can be repointed at new code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lockfile must be resolved on Linux: a macOS-generated one omits the
      # hoisted @emnapi/* that the wasm32-wasi fallbacks need, and npm ci rejects it.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # No AI CLI and no data/ on the runner — the build must not need either.
      - run: npm run build
