name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # better-sqlite3 requires Node >=22; 20 fails at install.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The lockfile must be resolved on Linux: a macOS-generated one omits the
      # hoisted @emnapi/* that the wasm32-wasi fallbacks need, and npm ci rejects it.
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # No AI CLI and no data/ on the runner — the build must not need either.
      - run: npm run build
